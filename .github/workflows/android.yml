# Reconstructed on 2026-11-17: the original file was lost from disk. Rebuilt from README section 8.5
# (GitHub Actions + GameCI) and Tools/build_android.ps1; not yet run in the cloud.
# Tests (EditMode gates the APK, PlayMode only reports) -> development APK (IL2CPP, ARM64, the same
# AndroidBuildScript as locally) -> 16 KB page checks and target API >= 36 -> APK artifact for 7 days.
name: Android

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'Tools/**'
      - 'Logs/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# PW-01/PW-02: brak sekretów na poziomie workflow. Poświadczenia Unity trafiają wyłącznie do
# kroków GameCI (przypiętych do SHA), a token GITHUB_TOKEN ma minimalne uprawnienia.
permissions:
  contents: read

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactsPath: test-results-editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: EditMode-results
          path: test-results-editmode
          retention-days: 7

  playmode:
    # Reports only: software rendering on a GPU-less runner is not proven yet. Once it is stable, add
    # `playmode` to the `needs` of the `android` job.
    name: PlayMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: playmode
          artifactsPath: test-results-playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: PlayMode-results
          path: test-results-playmode
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: PlayMode-screenshots
          path: |
            **/Screenshots/**
            **/*Screenshot*.png
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Development APK
    needs: editmode
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: Free disk space for the IL2CPP build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: Zmywak.EditorTools.AndroidBuildScript.BuildAndroid
          androidExportType: androidPackage
      - name: Find the APK
        id: apk
        run: |
          apk="Builds/Android/Zmywak-dev.apk"
          if [ ! -f "$apk" ]; then apk=$(find . -name 'Zmywak-dev.apk' -not -path './Library/*' | head -n 1); fi
          test -n "$apk" && test -f "$apk" || { echo "::error::No Zmywak-dev.apk after the build"; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
      - name: 16 KB pages and target API >= 36
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          apk="$APK_PATH"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $bt"
          "$bt/zipalign" -c -P 16 -v 4 "$apk" > zipalign.txt || { tail -n 20 zipalign.txt; echo "::error::APK is not 16 KB zip-aligned"; exit 1; }
          mkdir -p so && unzip -q -o "$apk" 'lib/*.so' -d so
          bad=0
          for so in $(find so -name '*.so'); do
            for a in $(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}'); do
              if [ $((a)) -lt $((0x4000)) ]; then echo "::error::$so has a LOAD segment aligned to $a (< 16 KB)"; bad=1; fi
            done
          done
          [ $bad -eq 0 ] || exit 1
          target=$("$bt/aapt2" dump badging "$apk" | sed -n "s/.*targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          echo "targetSdkVersion: $target"
          [ -n "$target" ] && [ "$target" -ge 36 ] || { echo "::error::targetSdkVersion $target < 36"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Zmywak-dev-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
